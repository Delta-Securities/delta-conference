# .github/workflows/ci.yml — стандарт Delta Securities (одинаковый каркас во всех репо).
#
# Job `ci` — единственная проверка, которую требует ruleset и scripts/deploy.sh:
# выкатка на прод и полигон разрешена только коммиту с зелёным `ci`.
# `ci` — агрегатор: зелёный, только если ВСЕ jobs из needs завершились success
# (skipped/cancelled/failure → красный). Имя job `ci` не менять и не задавать ему name.
#
# Как собрать файл для проекта:
#   1) скопировать этот каркас;
#   2) вставить jobs стека из templates/ci-jobs/*.yml (по одному на компонент);
#   3) перечислить их в needs у job `ci`;
#   4) блок deploy-staging оставить только там, где есть полигон (deltaprop, spread-arb),
#      в остальных репо — удалить.
# Без paths-фильтров: проверка должна появляться у каждого PR и каждого коммита.
name: ci

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

# Без concurrency на уровне workflow: у каждого коммита основной ветки и develop
# должен быть свой завершённый прогон `ci` (иначе его нельзя выкатить).
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts/ и deploy/
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/lib/*.sh deploy/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then echo "нет скриптов"; exit 0; fi
          shellcheck --version
          # -S error: блокируют только ошибки; предупреждения — на ревью.
          shellcheck -S error -x "${files[@]}"
      - name: библиотека деплоя без CRLF и с версией
        run: |
          for f in scripts/lib/ds-deploy.sh scripts/deploy.sh; do
            [ -f "$f" ] || { echo "нет $f (стандарт деплоя)"; exit 1; }
            if grep -q $'\r' "$f"; then echo "$f: CRLF"; exit 1; fi
            bash -n "$f"
          done
          grep -m1 '^DS_DEPLOY_LIB_VERSION=' scripts/lib/ds-deploy.sh
          # библиотека побайтно равна эталону стандарта (новая версия — PR во все репо)
          echo "a3831fcb081b390e71fef0e6a513ee3c5880264d618fd3a4df82e0f165431f09  scripts/lib/ds-deploy.sh" | sha256sum -c -

  # Next.js 16 (статический экспорт в out/): lint + build.
  next-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build          # next build включает проверку типов

  ci:
    if: always()
    needs: [shellcheck, next-site]
    runs-on: ubuntu-latest
    steps:
      - name: все проверки зелёные
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "результаты: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "не зелёное: $r"; exit 1; fi
          done
